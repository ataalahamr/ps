  <script>
    const SECRET_KEY = 2026;
    const FIREBASE_URL = "https://ps4-control-7ad50-default-rtdb.firebaseio.com";

    function getActivationCodeFromKey(keyNumber) {
      return ((keyNumber * SECRET_KEY) % 899999) + 100000;
    }

    function getDeviceKeyNumber() {
      let savedKey = localStorage.getItem("device_key_num");
      if (!savedKey) {
        let str = navigator.userAgent + screen.width + screen.height;
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        savedKey = (Math.abs(hash) % 8999) + 1000;
        localStorage.setItem("device_key_num", savedKey);
      }
      return parseInt(savedKey, 10);
    }

    // فحص حالة الحظر من Firebase عند توفر الإنترنت
    async function checkOnlineBlockStatus(deviceKeyStr) {
      if (navigator.onLine) {
        try {
          let res = await fetch(`${FIREBASE_URL}/devices/${deviceKeyStr}.json?t=${Date.now()}`);
          if (res.ok) {
            let data = await res.json();
            if (data && data.status === "blocked") {
              localStorage.removeItem("device_activated");
              alert("تم إلغاء تفعيل هذا الجهاز من قبل المسؤول!");
              location.reload();
            }
          }
        } catch (e) {
          console.log("Offline mode or Fetch error");
        }
      }
    }

    (function checkDeviceActivation() {
      const keyNum = getDeviceKeyNumber();
      const deviceKeyStr = "AT-" + keyNum;

      // تنفيذ الفحص الفوري للحظر الأونلاين
      checkOnlineBlockStatus(deviceKeyStr);

      const isActivated = localStorage.getItem("device_activated");

      if (isActivated !== "true") {
        const expectedCode = getActivationCodeFromKey(keyNum);

        console.log("Expected Activation Code for " + deviceKeyStr + " is: " + expectedCode);

        let userCode = prompt(
          "الجهاز غير مفعل!\n\n" +
          "Device Key: " + deviceKeyStr + "\n\n" +
          "أرسل هذا الكود عبر الواتساب على هاذ الرقم 01223739286 للحصول على كود تفعيل البايوس:"
        );

        if (userCode && parseInt(userCode.trim(), 10) === expectedCode) {
          localStorage.setItem("device_activated", "true");
          alert("تم تفعيل الجهاز بنجاح!");
        } else {
          alert("كود التفعيل غير صحيح!");
          document.write("<h2 style='color:red; text-align:center; margin-top:20vh; font-family:sans-serif;'>Device Not Activated</h2>");
          window.stop();
        }
      }
    })();
  </script>
